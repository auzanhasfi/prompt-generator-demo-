<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pratonton: Tipografi Kinetik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Instrument+Serif&display=swap" rel="stylesheet">
</head>
<body>
<script src="kit.js"></script>
<script>
/* Gaya 1: TIPOGRAFI KINETIK (hook potret). Bingkai = fungsi masa t. */
(function(){
var K=KIT, W=540, H=960, OR='#FD5E2B', CR='#F9F1E4', DK='#2A1208', INK='#1D120C';
var SER='"Instrument Serif", Georgia, serif', SAN='Archivo, system-ui, sans-serif';
function bgWarm(c,t,base,glow){var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,base[0]);g.addColorStop(1,base[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  var x=W*.7+Math.sin(t*.6)*60,y=H*.25+Math.cos(t*.5)*40,r=c.createRadialGradient(x,y,10,x,y,420);r.addColorStop(0,glow);r.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=r;c.fillRect(0,0,W,H);}
function marquee(c,t,word,col,alpha){c.save();c.globalAlpha=alpha;K.font(c,'900',64,SAN);c.fillStyle=col;c.textBaseline='middle';
  for(var row=0;row<12;row++){var dir=row%2?1:-1,y=40+row*80,off=((t*60*dir)%600+600)%600;var s=(word+'  ').repeat(6);c.fillText(s,-600+off-(row*90)%300,y);}c.restore();}
function giant(c,t,word,x,y,size,col){K.font(c,'900',size,SAN);var fw=c.measureText(word).width;if(fw>W-56){size=size*(W-56)/fw;K.font(c,'900',size,SAN);}c.textBaseline='alphabetic';var w=c.measureText(word).width,cx=x-w/2;
  for(var i=0;i<word.length;i++){var ch=word[i],cw=c.measureText(ch).width,k=K.prog(t,i*.05,i*.05+.32),e=K.back(k);
    if(k>0){var dy=(1-e)*-160;c.save();c.globalAlpha=Math.min(1,k*2);
      if(k<1){c.globalCompositeOperation='source-over';c.fillStyle='rgba(0,220,255,.7)';c.fillText(ch,cx-4*(1-k),y+dy);c.fillStyle='rgba(255,0,80,.7)';c.fillText(ch,cx+4*(1-k),y+dy);}
      c.fillStyle=col;c.fillText(ch,cx,y+dy);c.restore();}
    cx+=cw;}
  return w;}
function scramble(c,t,word,x,y,col){var L='ABCDEFGHIJKLMNOPRSTUW',out='';for(var i=0;i<word.length;i++){var k=K.prog(t,i*.06,i*.06+.3);out+=k>=1?word[i]:L[Math.floor(K.rnd(i+Math.floor(t*20))*L.length)];}c.fillStyle=col;c.fillText(out,x,y);}
function caret(c,x,y,h,col,t){if(Math.floor(t*2.5)%2)return;c.fillStyle=col;c.fillRect(x,y-h,4,h*1.15);}
function bracket(c,x,y,w,h,col){c.strokeStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.moveTo(x+w,y);c.lineTo(x+w,y+h);c.stroke();}

/* ---- adegan ---- */
function A(c,t){bgWarm(c,t,['#FF6A33','#E2461A'],'rgba(255,190,120,.55)');
  if(t>1.0)marquee(c,t,'KETAGIHAN','#fff',.13*K.prog(t,1,1.4));
  c.fillStyle='#fff';K.font(c,'400',62,SER);c.textBaseline='alphabetic';K.words(c,'Cikgu',40,170,{t:t-.1,rise:20});
  K.font(c,'800',28,SAN);K.words(c,'sekarang dah',200,168,{t:t-.5,rise:14});
  c.fillStyle='#fff';c.fillRect(40,236,(W-80)*K.eo(K.prog(t,.6,1.1)),3);
  if(t>1){c.save();var sh=Math.max(0,1-(t-1.6)*4);c.translate(Math.sin(t*90)*6*sh,0);giant(c,t-1,'KETAGIHAN',W/2,372,92,'#fff');c.restore();}
  c.fillStyle='#fff';c.fillRect(40,410,(W-80)*K.eo(K.prog(t,1.3,1.8)),3);
  K.font(c,'800',34,SAN);c.fillStyle=DK;K.words(c,'bina app sendiri.',W/2,480,{t:t-1.9,align:'center',hl:['app'],hlColor:'#fff'});
  if(t>2.2){var k=K.back(K.prog(t,2.2,2.7));[[150,700,'#7BD3F7',-8],[270,690,'#FFFFFF',4],[390,705,'#9CE0A8',10]].forEach(function(p,i){var kk=K.back(K.prog(t,2.2+i*.1,2.7+i*.1));c.save();c.translate(p[0],p[1]+(1-kk)*300);c.rotate(p[3]*Math.PI/180);c.fillStyle='rgba(0,0,0,.18)';K.rr(c,-46,-76,100,160,16);c.fill();c.fillStyle=DK;K.rr(c,-50,-84,100,160,16);c.fill();c.fillStyle=p[2];K.rr(c,-44,-76,88,144,11);c.fill();c.fillStyle='rgba(42,18,8,.5)';K.rr(c,-32,-56,64,10,4);c.fill();K.rr(c,-32,-36,44,10,4);c.fill();K.rr(c,-32,10,64,36,8);c.fill();c.restore();});}
  K.bulat(c,90,880,30,t,'happy');}
function B(c,t){bgWarm(c,t,['#FBF4E8','#F4E6D2'],'rgba(255,200,140,.5)');
  K.font(c,'800',30,SAN);c.fillStyle=INK;K.words(c,'Mula-mula cuma nak',W/2,330,{t:t,align:'center'});
  K.font(c,'400',74,SER);c.textBaseline='alphabetic';var w1=c.measureText('bantu').width,w2=c.measureText('mengajar.').width,x0=W/2-(w1+w2+14)/2;
  c.fillStyle=INK;c.globalAlpha=K.prog(t,.4,.7);c.fillText('bantu',x0,450);c.globalAlpha=1;
  if(t>.8){c.fillStyle=OR;scramble(c,t-.8,'mengajar.',x0+w1+14,450,OR);caret(c,x0+w1+w2+18,450,64,OR,t);}
  bracket(c,x0+w1+6,382,w2+16,84,OR);
  var k=K.back(K.prog(t,1.4,2));c.save();c.translate(W/2,640+(1-k)*200);c.rotate(-.12+Math.sin(t*2)*.03);c.fillStyle='rgba(0,0,0,.15)';K.rr(c,-110,-60,230,140,14);c.fill();c.fillStyle='#14946A';K.rr(c,-115,-70,230,140,14);c.fill();
  c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=4;c.beginPath();c.moveTo(-70,-20);c.lineTo(70,-20);c.moveTo(-70,0);c.lineTo(40,0);c.stroke();K.font(c,'800',22,SAN);c.fillStyle='rgba(255,255,255,.85)';c.textAlign='center';c.fillText('A B C',0,45);c.textAlign='left';c.restore();
  K.bulat(c,W/2+120,720,34,t,'happy');}
function C(c,t){bgWarm(c,t,['#3A1A0C','#1C0D06'],'rgba(253,94,43,.45)');
  if(t>.9)marquee(c,t,'BOLEH DIJUAL',OR,.12);
  K.font(c,'400',80,SER);c.fillStyle=OR;K.words(c,'Rupanya,',44,240,{t:t});
  var k=K.spring(K.prog(t,.7,1.5));c.save();c.translate(W/2,450);c.rotate((-6+ (1-k)*-20)*Math.PI/180);c.scale(.4+k*.6,.4+k*.6);
  c.fillStyle='#0E0805';K.rr(c,-215,-80,430,150,16);c.fill();c.fillStyle='#fff';K.rr(c,-205,-90,430,150,16);c.fill();
  K.font(c,'900',92,SAN);c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.fillText('BOLEH',10,-12);c.restore();
  K.font(c,'900',84,SAN);c.textAlign='center';c.fillStyle='#fff';c.textBaseline='alphabetic';var k2=K.eo(K.prog(t,1.2,1.6));c.save();c.beginPath();c.rect(0,520,W,120);c.clip();c.fillText('DIJUAL.',W/2,620+(1-k2)*100);c.restore();c.textAlign='left';
  for(var i=0;i<6;i++){var a=t*1.5+i,sx=W/2+Math.cos(a)*240,sy=470+Math.sin(a*1.3)*170,s=(Math.sin(t*6+i)+1)*.5;if(t>1){c.save();c.translate(sx,sy);c.rotate(t);c.fillStyle='#FFD08A';c.globalAlpha=s;c.beginPath();for(var j=0;j<4;j++){c.lineTo(Math.cos(j*Math.PI/2)*10,Math.sin(j*Math.PI/2)*10);c.lineTo(Math.cos(j*Math.PI/2+.78)*3,Math.sin(j*Math.PI/2+.78)*3);}c.fill();c.restore();}}
  K.bulat(c,120,840,32,t,'happy','#FFB648');K.bulat(c,420,850,28,t+.7,'happy');}
var STEPS=[['Pilih prompt','copy'],['Tampal ke AI','send'],['App siap','phone'],['Jual & promosi','coin']];
function D(c,t){bgWarm(c,t,['#2E150A','#170A05'],'rgba(253,94,43,.35)');
  K.font(c,'800',26,SAN);c.fillStyle='rgba(255,255,255,.75)';c.fillText('Caranya cuma',50,150);
  var act=Math.min(3,Math.floor(Math.max(0,t-.4)/1.25));c.fillStyle='rgba(253,94,43,.3)';c.fillRect(66,200,3,560);c.fillStyle=OR;c.fillRect(66,200,3,Math.min(560,140*act+140*K.eo(K.prog((t-.4)%1.25,0,.5))));
  STEPS.forEach(function(s,i){var y=240+i*140,on=i===act,k=K.eo(K.prog(t,.4+i*1.25,.75+i*1.25));if(k<=0)return;c.save();c.globalAlpha=k*(on?1:.45);c.translate((1-k)*40,0);
    c.fillStyle=on?OR:'rgba(255,255,255,.25)';K.circle(c,67,y,15);c.fill();K.font(c,'800',16,SAN);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(i+1,67,y+1);c.textAlign='left';
    K.font(c,'900',on?46:34,SAN);c.fillStyle='#fff';c.fillText(s[0],100,y);var w=c.measureText(s[0]).width;if(on){bracket(c,92,y-32,w+16,64,OR);K.icon(c,s[1],110+w+16,y-17,34,OR,2.2);}
    c.restore();c.textBaseline='alphabetic';});
  K.bulat(c,460,880,30,t,act===3?'happy':'');}
function E(c,t){bgWarm(c,t,['#FF6A33','#DE4418'],'rgba(255,210,150,.55)');marquee(c,t,'KOMEN APP',DK,.08);
  K.font(c,'400',66,SER);c.fillStyle='#fff';K.words(c,'Nak prompt-nya?',W/2,300,{t:t,align:'center'});
  var k=K.back(K.prog(t,.6,1.1));c.save();c.translate(W/2,460);c.scale(k,k);c.fillStyle='#fff';K.rr(c,-205,-70,410,130,24);c.fill();K.font(c,'900',64,SAN);c.textBaseline='middle';var a1=c.measureText('Komen ').width,a2=c.measureText('APP').width,ax=-(a1+a2)/2;c.fillStyle=INK;c.fillText('Komen',ax,-4);c.fillStyle=OR;c.fillText('APP',ax+a1,-4);c.restore();
  c.textAlign='left';c.textBaseline='alphabetic';bracket(c,W/2-210,380,420,160,'#fff');
  K.font(c,'800',26,SAN);c.fillStyle=DK;K.words(c,'link terus masuk DM',W/2,600,{t:t-1.2,align:'center'});
  for(var i=0;i<3;i++){var a=K.cl(Math.sin(t*4-i*.8)*.5+.5);c.strokeStyle='rgba(255,255,255,'+(.3+a*.7)+')';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(W/2-36,680+i*34);c.lineTo(W/2,712+i*34);c.lineTo(W/2+36,680+i*34);c.stroke();}
  K.bulat(c,110,870,32,t,'happy','#fff');K.bulat(c,430,870,32,t+.4,'happy','#FFB648');}
var SC=[[0,3.4,A],[3.4,6.8,B],[6.8,10,C],[10,15.4,D],[15.4,20,E]];
function draw(c,t){var cur=0;for(var i=0;i<SC.length;i++)if(t>=SC[i][0])cur=i;
  var s=SC[cur],lt=t-s[0];
  if(cur>0&&lt<.4){var p=SC[cur-1];p[2](c,t-p[0]);var k=K.eio(lt/.4);c.save();c.beginPath();for(var b=0;b<6;b++){var kb=K.cl(k*1.6-b*.12);c.rect(0,b*H/6,W*kb,H/6+1);}c.clip();s[2](c,lt);c.restore();}
  else s[2](c,lt);
  /* butiran filem */ c.globalAlpha=.06;for(var n=0;n<60;n++){c.fillStyle=n%2?'#fff':'#000';c.fillRect(K.rnd(n+Math.floor(t*24)*7)*W,K.rnd(n*3+Math.floor(t*24))*H,2,2);}c.globalAlpha=1;}
K.film({W:W,H:H,dur:20,poster:1.9,bpm:100,chords:[57,53,48,55],mood:'drive',
  sfx:[[1,'boom'],[3.4,'whoosh'],[4.2,'tap'],[6.8,'whoosh'],[7.6,'boom'],[10,'whoosh'],[10.4,'pop'],[11.65,'pop'],[12.9,'pop'],[14.15,'ding'],[15.4,'whoosh'],[16,'boom']],
  prep:function(){return Promise.all([document.fonts.load('900 40px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('40px "Instrument Serif"')]).catch(function(){})},
  draw:draw});
})();
</script>
</body>
</html>
